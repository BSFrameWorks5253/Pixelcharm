name: Release Pixelcharm Setup EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-exe:
    name: Build & Publish Pixelcharm Setup EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip pillow

      - name: Install Node Dependencies
        run: npm install

      - name: Generate Pixelcharm Icons
        run: npm run build:icons

      - name: Build Web & Electron Bundles
        run: npm run build

      - name: Package & Publish Setup EXE to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win nsis --publish always
